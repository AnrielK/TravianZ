name: iOS – TravianZ offline aplikace

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MARIADB_FORMULA: mariadb@11.4

jobs:
  # ------------------------------------------------------------------ Swift package (logic without UI)
  core-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift test
        run: swift test --package-path Packages/TravianZCore 2>&1 | tee core-tests.log
      - name: Report logs
        if: always()
        run: |
          set +e
          R="$RUNNER_TEMP/report/tz-run-${{ github.run_number }}-core"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }}" > "$R/STATUS"
          tail -n 300 core-tests.log > "$R/core-tests.log"
          .github/scripts/push-ci-logs.sh "$RUNNER_TEMP/report" "${{ secrets.GITHUB_TOKEN }}"

  # ------------------------------------------------------------------ PHP 8.3 (ZTS) as a static library
  php-core:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            .github
      - name: Cache PHPCore
        id: cache
        uses: actions/cache@v4
        with:
          path: ios/php/build/PHPCore.xcframework
          key: tz-phpcore-${{ hashFiles('ios/php/build-php-ios.sh', 'ios/php/PHPCore.h', 'ios/php/module.modulemap') }}
      - name: Build PHP for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          ios/php/build-php-ios.sh 2>&1 | tee ios-php-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: PHPCore.xcframework
          path: ios/php/build/PHPCore.xcframework
      - name: Report logs
        if: always()
        run: |
          set +e
          R="$RUNNER_TEMP/report/tz-run-${{ github.run_number }}-php"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }}" > "$R/STATUS"
          cp ios-php-build.log "$R/" 2>/dev/null
          for p in iphoneos iphonesimulator; do
            for f in libpng.log libjpeg.log php-configure.log php-config.log; do
              [ -f ios/php/build/$p/$f ] && tail -n 300 ios/php/build/$p/$f > "$R/$p-$f"
            done
            [ -f ios/php/build/$p/php-make.log ] && grep -n -B3 -A12 -E "error:|Error [0-9]" ios/php/build/$p/php-make.log | tail -n 400 > "$R/$p-php-make-errors.log"
          done
          .github/scripts/push-ci-logs.sh "$RUNNER_TEMP/report" "${{ secrets.GITHUB_TOKEN }}"

  # ------------------------------------------------------------------ MariaDB server as a static library
  mariadb-core:
    runs-on: macos-15
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        platform: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            .github
      - name: Tools + MariaDB version
        run: |
          brew install bison ninja >/dev/null
          V=$(brew info --json=v2 "$MARIADB_FORMULA" | python3 -c 'import json,sys;print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')
          echo "MARIADB_VERSION=$V" >> "$GITHUB_ENV"; echo "MariaDB $V"
      - name: Cache MariaDB slice
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ios/mariadb/build/${{ matrix.platform }}/libmariadbcore.a
            ios/mariadb/build/${{ matrix.platform }}/include
            ios/mariadb/build/share
          key: tz-mariadb-${{ matrix.platform }}-${{ env.MARIADB_VERSION }}-${{ hashFiles('ios/mariadb/build-mariadb-ios.sh', 'ios/mariadb/mariadb-options.cmake', 'ios/mariadb/patch-source.py', 'ios/mariadb/MariaDBCore.h', 'ios/mariadb/module.modulemap') }}
      - name: Build MariaDB for ${{ matrix.platform }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          ios/mariadb/build-mariadb-ios.sh ${{ matrix.platform }} 2>&1 | tee mariadb-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: mariadb-${{ matrix.platform }}
          path: |
            ios/mariadb/build/${{ matrix.platform }}/libmariadbcore.a
            ios/mariadb/build/${{ matrix.platform }}/include
            ios/mariadb/build/share
      - name: Report logs
        if: always()
        run: |
          set +e
          R="$RUNNER_TEMP/report/tz-run-${{ github.run_number }}-mariadb-${{ matrix.platform }}"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }} version=$MARIADB_VERSION" > "$R/STATUS"
          tail -n 200 mariadb-build.log > "$R/build-tail.log" 2>/dev/null
          P=ios/mariadb/build/${{ matrix.platform }}
          [ -f $P/mariadb-configure.log ] && tail -n 250 $P/mariadb-configure.log > "$R/configure.log"
          [ -f $P/mariadb-build.log ] && grep -n -B4 -A14 -E "error:|FAILED" $P/mariadb-build.log | head -n 500 > "$R/build-errors.log"
          .github/scripts/push-ci-logs.sh "$RUNNER_TEMP/report" "${{ secrets.GITHUB_TOKEN }}"

  # ------------------------------------------------------------------ app: build, simulator e2e test, IPA
  app:
    needs: [core-tests, php-core, mariadb-core]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: PHPCore.xcframework
          path: ios/php/build/PHPCore.xcframework
      - uses: actions/download-artifact@v4
        with:
          pattern: mariadb-*
          path: ios/mariadb/build
          merge-multiple: true
      - name: Tools
        run: brew install xcodegen "$MARIADB_FORMULA" >/dev/null
      - name: MariaDB xcframework + data template
        run: |
          set -o pipefail
          bash ios/mariadb/make-xcframework.sh 2>&1 | tee prep.log
          bash ios/mariadb/make-template.sh ios/mariadb/build/template travianz-ios-local 2>&1 | tee -a prep.log
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project TravianZ.xcodeproj -scheme TravianZ -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/TravianZ.app
      - name: Run in simulator + end-to-end test
        id: e2e
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/TravianZ.app
          xcrun simctl launch "$UDID" com.anriel.travianz -port 8080
          CONTAINER="$(xcrun simctl get_app_container "$UDID" com.anriel.travianz data)"
          DATA="$CONTAINER/Library/Application Support/TravianZ"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "LOGS=$CONTAINER/Documents/logs" >> "$GITHUB_ENV"
          for i in $(seq 1 300); do
            curl -sf http://127.0.0.1:8080/__tz/health | grep -q '"ready"' && break
            sleep 2
          done
          curl -s http://127.0.0.1:8080/__tz/health; echo
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshot-start.png || true
          TOKEN=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["controlToken"])' "$DATA/secrets.json")
          ADMIN=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["adminPassword"])' "$DATA/secrets.json")
          curl -s -m 30 -H "X-TZ-Token: $TOKEN" http://127.0.0.1:8080/__tz/status > control-status.json || true
          set +e
          python3 ios/tests/e2e.py http://127.0.0.1:8080 "$TOKEN" "$ADMIN" > e2e.log 2>&1
          rc=$?
          cat e2e.log
          xcrun simctl io "$UDID" screenshot screenshot.png || true
          exit $rc
      - name: Build unsigned IPA (iPhone)
        run: |
          set -o pipefail
          xcodebuild -project TravianZ.xcodeproj -scheme TravianZ -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          rm -rf Payload && mkdir -p Payload && cp -R build-device/Build/Products/Release-iphoneos/TravianZ.app Payload/
          zip -qry TravianZ-unsigned.ipa Payload
          ls -lh TravianZ-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TravianZ-unsigned-ipa
          path: TravianZ-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            xcodebuild-sim.log
      - name: End-to-end result
        run: grep -q "E2E PASSED" e2e.log
      - name: Report logs
        if: always()
        run: |
          set +e
          R="$RUNNER_TEMP/report/tz-run-${{ github.run_number }}-app"; mkdir -p "$R"
          echo "status=${{ job.status }} sha=${{ github.sha }}" > "$R/STATUS"
          for f in prep.log e2e.log screenshot.png screenshot-start.png control-status.json; do [ -f $f ] && cp $f "$R/"; done
          for f in install.log template.err version.txt; do [ -f ios/mariadb/build/template/$f ] && head -n 150 ios/mariadb/build/template/$f > "$R/template-$f"; done
          for f in xcodebuild-sim.log xcodebuild.log; do
            [ -f $f ] && { grep -n -B2 -A6 -E "error:|Undefined symbol|ld: |duplicate symbol" $f | head -n 400 > "$R/${f%.log}-errors.log"; tail -n 60 $f > "$R/${f%.log}-tail.log"; }
          done
          if [ -n "$LOGS" ]; then
            for f in server.log php-errors.log mariadb.log automation.log setup.log last-start.txt; do
              [ -f "$LOGS/$f" ] || continue
              { head -n 150 "$LOGS/$f"; echo "……"; tail -n 200 "$LOGS/$f"; } | grep -v " Accepted$\| Closing$" > "$R/app-$f"
            done
            ls -la "$DATA" "$LOGS" "$DATA/www" > "$R/app-files.txt" 2>&1
          fi
          [ -n "$UDID" ] && xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "TravianZ"' --style compact 2>/dev/null | tail -n 300 > "$R/app-oslog.log"
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i travianz | head -3 | while read c; do cp ~/Library/Logs/DiagnosticReports/"$c" "$R/"; done
          .github/scripts/push-ci-logs.sh "$RUNNER_TEMP/report" "${{ secrets.GITHUB_TOKEN }}"
