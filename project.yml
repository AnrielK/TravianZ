name: TravianZ
options:
  bundleIdPrefix: com.anriel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  TravianZCore:
    path: Packages/TravianZCore
targets:
  TravianZ:
    type: application
    platform: iOS
    sources:
      - path: TravianZ
    dependencies:
      - package: TravianZCore
      - framework: ios/php/build/PHPCore.xcframework
        embed: false
        link: true
      - framework: ios/mariadb/build/MariaDBCore.xcframework
        embed: false
        link: true
      - sdk: libz.tbd
      - sdk: libiconv.tbd
      - sdk: libresolv.tbd
      - sdk: libc++.tbd
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: TravianZ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anriel.travianz
        PRODUCT_NAME: TravianZ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-ObjC", "-lc++"]
    postCompileScripts:
      - name: Bundle TravianZ, PHP router, MariaDB share and data template
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$RES/game" "$RES/runtime"
          rsync -a --delete --delete-excluded \
                --exclude '.*' --exclude 'Multi-Instance Server/' --exclude '/tests/' --exclude '/docker/' \
                --exclude '/Dockerfile' --exclude '/docker-compose.yml' --exclude '/*.md' --exclude '/ISSUE_TEMPLATE.md' \
                "${SRCROOT}/game/" "$RES/game/"
          rsync -a --delete "${SRCROOT}/ios/runtime/router.php" "${SRCROOT}/ios/runtime/control.php" "$RES/runtime/"
          (cd "${SRCROOT}" && git rev-parse --short HEAD 2>/dev/null || date +%s) > "$RES/game/.build-id"
          date +%s >> "$RES/game/.build-id"
          rsync -a --delete "${SRCROOT}/ios/mariadb/build/share/" "$RES/mariadb-share/"
          rsync -a --delete "${SRCROOT}/ios/mariadb/build/template/data/" "$RES/mariadb-template/"
